[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neural-denoise"
version = "0.1.0"
description = "Classical and learned denoising of real smartphone photos on SIDD, compared in PSNR, SSIM and compute time"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "opencv-python>=4.10,<5",
    "matplotlib>=3.9,<4",
    "scipy>=1.14,<2",
    "bm3d>=4.0.3,<5",
    "truststore>=0.10,<1",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
neural = ["torch==2.9.1", "onnxscript>=0.5,<1"]

[tool.uv]
exclude-newer = "2026-08-03T22:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_denoise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python", ".runtime", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
